<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق خدماتي 🚀</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f9; padding: 20px; direction: rtl; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input, select, textarea, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
    button:hover { background: #219150; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>تطبيق خدماتي 🚀</h2>
  <form id="serviceForm">
    
    <label>نوع المستخدم:</label>
    <select id="user_type" name="user_type" required>
      <option value="">اختر النوع...</option>
      <option value="عميل (أبحث عن خدمة)">عميل (أبحث عن خدمة)</option>
      <option value="عامل / صاحب مهنة (أقدم خدمة)">عامل / صاحب مهنة (أقدم خدمة)</option>
    </select>

    <label>الاسم الكامل:</label>
    <input type="text" id="name" name="name" required placeholder="أدخل اسمك الكريم">

    <label>رقم الهاتف / واتساب:</label>
    <input type="tel" id="phone" name="phone" required placeholder="77XXXXXXX">

    <label>الدولة:</label>
    <select id="country" name="country" required>
      <option value="اليمن 🇾🇪">اليمن 🇾🇪</option>
    </select>

    <label>المحافظة:</label>
    <select id="city" name="city" required>
      <option value="">اختر المحافظة...</option>
      <option value="تعز">تعز</option>
      <option value="أمانة العاصمة (صنعاء)">أمانة العاصمة (صنعاء)</option>
      <option value="محافظة صنعاء">محافظة صنعاء</option>
      <option value="عدن">عدن</option>
      <option value="إب">إب</option>
      <option value="الحديدة">الحديدة</option>
      <option value="حضرموت">حضرموت</option>
      <option value="ذمار">ذمار</option>
      <option value="لحج">لحج</option>
      <option value="أبين">أبين</option>
      <option value="صعدة">صعدة</option>
      <option value="عمران">عمران</option>
      <option value="حجة">حجة</option>
      <option value="البيضاء">البيضاء</option>
      <option value="مأرب">مأرب</option>
      <option value="شبوة">شبوة</option>
      <option value="المهرة">المهرة</option>
      <option value="الضالع">الضالع</option>
      <option value="ريمة">ريمة</option>
      <option value="سقطرى">سقطرى</option>
      <option value="الجوف">الجوف</option>
    </select>

    <label>المنطقة / الحارة / الشارع:</label>
    <input type="text" id="area" name="area" required placeholder="مثال: المظفر / شارع جمال">

    <label>التخصص / الخدمة المطلوب تقديمها:</label>
    <select id="service" name="service" required>
      <option value="">اختر الخدمة...</option>
      <option value="سباك">سباك</option>
      <option value="نجار">نجار</option>
      <option value="كهربائي">كهربائي</option>
      <option value="دهان">دهان</option>
      <option value="تنظيف منازل">تنظيف منازل</option>
      <option value="تصميم">تصميم</option>
      <option value="برمجة">برمجة</option>
      <option value="تسويق">تسويق</option>
      <option value="صيانة أجهزة">صيانة أجهزة منزلية</option>
      <option value="أخرى">أخرى</option>
    </select>

    <button type="submit" id="submitBtn">إرسال البيانات</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const SHEETDB_URL = 'https://sheetdb.io/api/v1/hzh3b6r3dr64r';
  

  document.getElementById('serviceForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'جاري الإرسال...';
    statusDiv.innerText = '';

    const formData = {
      "data": [{
        "الاسم": document.getElementById('name').value,
        "رقم الهاتف": document.getElementById('phone').value,
        "نوع المستخدم": document.getElementById('user_type').value,
        "المحافظة": document.getElementById('city').value,
        "المنطقة": document.getElementById('area').value,
        "الخدمة": document.getElementById('service').value
      }]
    };

    fetch(SHEETDB_URL, {
      method: 'POST',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
      if(data.created) {
        statusDiv.style.color = 'green';
        statusDiv.innerText = 'تم تسجيل البيانات بنجاح في جدول البيانات! ✅';
        document.getElementById('serviceForm').reset();
      } else {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.';
      }
      submitBtn.disabled = false;
      submitBtn.innerText = 'إرسال البيانات';
    })
    .catch(error => {
      console.error('Error:', error);
      statusDiv.style.color = 'red';
      statusDiv.innerText = 'حدث خطأ في الاتصال بالشبكة.';
      submitBtn.disabled = false;
      submitBtn.innerText = 'إرسال البيانات';
    });
  });
</script>

</body>
        </html>
