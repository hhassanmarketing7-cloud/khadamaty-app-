<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق خدمتي</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
        input, select, textarea, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>تطبيق خدمتي 🚀</h2>
    <form>
        <label>الاسم:</label>
        <input type="text" placeholder="أدخل اسمك">
        <label>رقم الهاتف:</label>
        <input type="tel" placeholder="05XXXXXXXX">
        <label>الخدمة:</label>
        <select>
            <option>تصميم</option>
            <option>برمجة</option>
            <option>تسويق</option>
        </select>
        <label>التفاصيل:</label>
        <textarea rows="4"></textarea>
        <button type="submit">إرسال الطلب</button>
    </form>
</div>
</body>
</html>
